name: Release on main

on:
  push:
    branches: [ main ]
    paths:
      - setup.py
      - libgen_api_enhanced/_version.py
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build_release_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Extract version from _version.py
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          ns = {}
          exec(pathlib.Path("libgen_api_enhanced/_version.py").read_text(encoding="utf-8"), ns)
          print(f"value={ns['__version__']}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Create GitHub Release for v${{ steps.version.outputs.value }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Publish to PyPI with API token
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
